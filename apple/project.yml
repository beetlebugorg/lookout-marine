# XcodeGen spec for the Lookout Marine app (macOS + iOS/iPadOS).
#
# Why XcodeGen: it declares the whole target — build settings, the Zig run-script
# phase, header/library search paths, framework links, bridging header — in this
# reviewable file instead of a fragile hand-written .pbxproj. Generate the project
# with:
#
#     brew install xcodegen         # once
#     cd apple && xcodegen generate # writes LookoutMarine.xcodeproj
#     open LookoutMarine.xcodeproj
#
# The only other tool needed is Zig: the pre-build script runs `zig build`,
# which builds the lookout core AND the tile57 engine (a zig package
# dependency — a sibling ../tile57 checkout if present, else fetched
# automatically per the pin in ../build.zig.zon) and installs the archives +
# headers into ../zig-out*/ for the app target to link.

name: LookoutMarine

options:
  bundleIdPrefix: org.beetlebug
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
  createIntermediateGroups: true

targets:
  LookoutMarine:
    type: application
    platform: macOS
    sources:
      - path: LookoutMarine
    settings:
      base:
        PRODUCT_NAME: LookoutMarine
        PRODUCT_BUNDLE_IDENTIFIER: org.beetlebug.lookout-marine
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: LookoutMarine/Info.plist
        CODE_SIGN_ENTITLEMENTS: LookoutMarine/LookoutMarine.entitlements
        CODE_SIGN_STYLE: Automatic
        # LookoutMarine/Assets.xcassets/AppIcon.appiconset — the squircle-masked
        # macOS master at the ten sizes iconutil wants. actool compiles it into
        # Assets.car AND writes AppIcon.icns into Resources, which is what
        # CFBundleIconFile in Info.plist names.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: LookoutMarine/Bridging-Header.h
        # The Zig cores are built arm64-only (Apple Silicon) — without this a
        # Release build tries a universal binary and the x86_64 slice fails.
        ARCHS: arm64
        # Let the Zig build phase run without the user-script sandbox blocking it.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # lookout.h + tile57.h, both installed by `zig build`.
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/../zig-out/include"
        LIBRARY_SEARCH_PATHS:
          - "$(SRCROOT)/../zig-out/lib"
        # The merged, libtool-repacked Zig cores (see the pre-build script) —
        # ld64 rejects zig-emitted archive members ("not 8-byte aligned"), so
        # the raw archives are never linked directly on ANY platform.
        OTHER_LDFLAGS:
          - "-llookoutall"
          # zlib, for the libpng the core is built against (-Dlibpng). The
          # zig archive carries libpng's objects with their zlib symbols still
          # undefined, so the resolve happens HERE, at the app link. Both
          # platforms ship libz, so this is a stock system library.
          - "-lz"
    dependencies:
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: CoreGraphics.framework
      - sdk: UniformTypeIdentifiers.framework
    preBuildScripts:
      - name: Build Zig cores (lookout + tile57 dependency)
        basedOnDependencyAnalysis: false
        script: |
          set -e
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          # Provenance: the build log states exactly which sources these cores
          # came from — never infer it again. tile57 is a zig package
          # dependency: a sibling checkout when present, else the zon pin.
          T57="$SRCROOT/../../tile57"
          echo "zig cores: lookout=$(git -C "$SRCROOT/.." rev-parse --short HEAD 2>/dev/null || echo '?') | tile57=$([ -f "$T57/build.zig" ] && git -C "$T57" rev-parse --short HEAD 2>/dev/null || echo 'fetched: build.zig.zon pin')"
          # Version the target at the DEPLOYMENT minimum: an unversioned native
          # build stamps objects with the build machine's OS and ld warns
          # "built for newer macOS version than being linked" on every object.
          ZIG_MAC_TARGET="$(uname -m | sed s/arm64/aarch64/)-macos.${MACOSX_DEPLOYMENT_TARGET:-26.0}"
          # An explicit -Dtarget makes zig a CROSS build: no automatic SDK
          # discovery, so hand it the sysroot like the iOS script does.
          MAC_SYSROOT="${SDKROOT:-$(xcrun --sdk macosx --show-sdk-path)}"
          cd "$SRCROOT/.."
          # The wasm plugin host, before the core that embeds it. Own ship,
          # AIS, NMEA 0183, Signal K and laylines are all plugins, so a core
          # built without the host is a chartplotter with no own ship and no
          # traffic. build-wamr.sh is idempotent: it compares the WAMR_VERSION
          # stamp in the dist against the release, commit and feature set it
          # would build now, and returns in a fraction of a second once they
          # match. The first run clones and builds the pinned WAMR and takes a
          # few minutes. -Dplugins is passed explicitly below because its
          # default is off when the archive is absent, which builds a working
          # app with no plugin host inside it. Explicit turns that into a build
          # error naming this script.
          scripts/build-wamr.sh macos
          # One build: the tile57 engine (zig package dependency) + the lookout
          # core, installing liblookout_marine.a, libtile57.a, and both headers
          # into zig-out/. ReleaseFast is the build.zig default; explicit here
          # so the app build states its intent.
          zig build -Doptimize=ReleaseFast -Dplugins=true -Dtarget="$ZIG_MAC_TARGET" --sysroot "$MAC_SYSROOT"
          # Zig's outputs are deterministic, so an unchanged core hashes
          # identically — used twice below: to skip the repack, and to force
          # Xcode to relink when the core DID change.
          CORE_HASH=$(cat "zig-out/lib/liblookout_marine.a" "zig-out/lib/libtile57.a" | /usr/bin/shasum | cut -d' ' -f1)

          # ld64 AND libtool both drop/reject zig-emitted archive members
          # ("64-bit mach-o not 8-byte aligned"), so the raw archives are never
          # linked directly: extract to loose objects (no offset-alignment
          # problem; zig also records mode-0 permissions, hence the chmod) and
          # repack, exactly like the iOS target. Skipped when unchanged.
          REPACK_STAMP="zig-out/lib/.liblookoutall.stamp"
          if [ "$(cat "$REPACK_STAMP" 2>/dev/null)" != "$CORE_HASH" ] \
             || [ ! -f "zig-out/lib/liblookoutall.a" ]; then
            REPACK="zig-out/repack"
            rm -rf "$REPACK"; mkdir -p "$REPACK/lookout" "$REPACK/tile57"
            (cd "$REPACK/lookout" && ar x ../../lib/liblookout_marine.a)
            (cd "$REPACK/tile57"  && ar x ../../lib/libtile57.a)
            chmod 644 "$REPACK"/lookout/*.o "$REPACK"/tile57/*.o
            xcrun -sdk macosx libtool -static \
              -o "zig-out/lib/liblookoutall.a" \
              "$REPACK"/lookout/*.o "$REPACK"/tile57/*.o 2>/dev/null
            echo "$CORE_HASH" > "$REPACK_STAMP"
          fi

          # Xcode doesn't track libraries fed in via OTHER_LDFLAGS -l flags, so
          # a rebuilt Zig core would never RELINK the app (stale core in the
          # bundle). Force the link when the core changed by removing the
          # previous executable (link-only cost). The stamp lives in
          # TARGET_BUILD_DIR: per configuration, like the executable it guards.
          LINK_STAMP="$TARGET_BUILD_DIR/.zigcore.stamp"
          if [ "$(cat "$LINK_STAMP" 2>/dev/null)" != "$CORE_HASH" ]; then
            mkdir -p "$TARGET_BUILD_DIR"
            echo "$CORE_HASH" > "$LINK_STAMP"
            rm -f "$TARGET_BUILD_DIR/$EXECUTABLE_PATH"
          fi
    postBuildScripts:
      # The core plugins travel inside the app. Without this the download is a
      # chartplotter with no own ship and no traffic: own ship, AIS, NMEA 0183,
      # Signal K and laylines are all plugins, and until now they only ran when
      # LOOKOUT_PLUGINS pointed at a dev build.
      #
      # It runs AFTER the bundle exists so the copy lands in a real Resources
      # directory, and before code signing, which Xcode does once every phase
      # has run. ChartController.loadBundledPlugins reads the result.
      - name: Bundle the core plugins into Resources/Plugins
        basedOnDependencyAnalysis: false
        script: |
          set -e
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          cd "$SRCROOT/.."
          # zig-out/plugins-bundled holds the shipped set and nothing else;
          # zig-out/plugins is the dev working set and may carry examples and
          # a developer's own modules beside it. The wasm is target-neutral,
          # so this needs no -Dtarget and builds nothing native.
          zig build plugins
          DEST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Plugins"
          mkdir -p "$DEST"
          # --delete so a plugin dropped from the shipped set leaves the app
          # instead of lingering in an incremental build.
          rsync -a --delete zig-out/plugins-bundled/ "$DEST/"
          echo "bundled plugins: $(ls "$DEST" | grep -c '\.wasm$') module(s) in $DEST"

  # ---- iOS / iPadOS ----------------------------------------------------------
  # Same Swift sources; the chart renders via Metal into ChartUIView's own
  # CAMetalLayer (the plain-UIKit input window), with the SwiftUI chrome in a
  # PassThroughWindow above. No dependency beyond this repo: the pre-build
  # script cross-builds the zig cores (tile57 included, as a package
  # dependency) per platform into ../zig-out-$PLATFORM_NAME/.
  LookoutMarine-iOS:
    type: application
    platform: iOS
    sources:
      - path: LookoutMarine
        excludes:
          - "Info.plist"
          - "LookoutMarine.entitlements"
          # The macOS icon catalog: its AppIcon is drawn on Apple's *macOS*
          # grid (inset + squircle-masked) and its images carry the "mac"
          # idiom, so it must not reach this target — iOS gets its own AppIcon
          # in LookoutMarine-iOS/Assets.xcassets.
          - "Assets.xcassets"
      # The launch screen background color (UILaunchScreen/UIColorName) and the
      # 1024 AppIcon.
      - path: LookoutMarine-iOS/Assets.xcassets
    settings:
      base:
        PRODUCT_NAME: LookoutMarine
        PRODUCT_BUNDLE_IDENTIFIER: org.beetlebug.lookout-marine-ios
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: LookoutMarine-iOS/Info.plist
        CODE_SIGN_STYLE: Automatic
        # LookoutMarine-iOS/Assets.xcassets/AppIcon.appiconset — one 1024
        # square with no alpha channel, per Apple's single-size iOS slot. iOS
        # applies the corner mask itself.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: LookoutMarine/Bridging-Header.h
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # The Zig cores are built arm64-only (Apple Silicon simulators + all
        # supported devices) — don't ask ld for x86_64.
        ARCHS: arm64
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/../zig-out-$(PLATFORM_NAME)/include"
        LIBRARY_SEARCH_PATHS:
          - "$(SRCROOT)/../zig-out-$(PLATFORM_NAME)/lib"
        # The merged, libtool-repacked Zig cores (see the pre-build script).
        OTHER_LDFLAGS:
          - "-llookoutall"
          # zlib, for the libpng the core is built against (-Dlibpng). The
          # zig archive carries libpng's objects with their zlib symbols still
          # undefined, so the resolve happens HERE, at the app link. Both
          # platforms ship libz, so this is a stock system library.
          - "-lz"
    dependencies:
      - sdk: UIKit.framework
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: CoreGraphics.framework
      - sdk: UniformTypeIdentifiers.framework
    preBuildScripts:
      - name: Build Zig cores for iOS (lookout + tile57 dependency)
        basedOnDependencyAnalysis: false
        script: |
          set -e
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          # Provenance: the build log states exactly which sources these cores
          # came from — never infer it again. tile57 is a zig package
          # dependency: a sibling checkout when present, else the zon pin.
          T57="$SRCROOT/../../tile57"
          echo "zig cores: lookout=$(git -C "$SRCROOT/.." rev-parse --short HEAD 2>/dev/null || echo '?') | tile57=$([ -f "$T57/build.zig" ] && git -C "$T57" rev-parse --short HEAD 2>/dev/null || echo 'fetched: build.zig.zon pin')"
          # Versioned at the deployment minimum — see the macOS target's note.
          IOS_MIN="${IPHONEOS_DEPLOYMENT_TARGET:-26.0}"
          # build.zig picks the WAMR dist directory from the zig target:
          # vendor/wamr-dist-iossim for the simulator, vendor/wamr-dist-ios for
          # a device. The two selections must agree.
          case "$PLATFORM_NAME" in
            iphonesimulator) ZIG_TARGET="aarch64-ios.${IOS_MIN}-simulator"; WAMR_TARGET=iossim ;;
            *)               ZIG_TARGET="aarch64-ios.${IOS_MIN}";           WAMR_TARGET=ios ;;
          esac
          # The iOS SDK sysroot. $SDKROOT is set by Xcode to the active SDK, so
          # this works in the Xcode build env even when the *shell's* xcrun/
          # xcode-select points at the Command Line Tools (which have no iOS SDK
          # -> an empty --sysroot). Fall back to xcrun for non-Xcode invocations.
          SYSROOT="${SDKROOT:-$(xcrun --sdk "$PLATFORM_NAME" --show-sdk-path)}"

          # One cross-build: the tile57 engine (zig package dependency) + the
          # lookout core, installing both archives + headers into
          # zig-out-$PLATFORM_NAME/ (device and simulator keep separate
          # prefixes). Zig's cache makes unchanged rebuilds ~instant.
          cd "$SRCROOT/.."
          # The wasm plugin host for this platform, before the core that embeds
          # it. See the macOS target for why -Dplugins is explicit.
          scripts/build-wamr.sh "$WAMR_TARGET"
          zig build -Doptimize=ReleaseFast \
            -Dplugins=true \
            -Dtarget="$ZIG_TARGET" \
            --sysroot "$SYSROOT" \
            -p "zig-out-$PLATFORM_NAME"
          # Zig's outputs are deterministic, so an unchanged core hashes
          # identically — used twice below: to skip the repack, and to force
          # Xcode to relink when the core DID change.
          CORE_HASH=$(cat "zig-out-$PLATFORM_NAME/lib/liblookout_marine.a" "zig-out-$PLATFORM_NAME/lib/libtile57.a" | /usr/bin/shasum | cut -d' ' -f1)

          # ld64 AND libtool both drop zig-emitted archive members ("64-bit
          # mach-o not 8-byte aligned"), so feeding the archives to libtool
          # silently loses every symbol. Extract the members to loose object
          # files (which have no offset-alignment problem; zig also records
          # mode-0 permissions, hence the chmod) and repack from those.
          # Skipped when the archives are byte-identical to the last repack.
          REPACK_STAMP="zig-out-$PLATFORM_NAME/lib/.liblookoutall.stamp"
          if [ "$(cat "$REPACK_STAMP" 2>/dev/null)" != "$CORE_HASH" ] \
             || [ ! -f "zig-out-$PLATFORM_NAME/lib/liblookoutall.a" ]; then
            REPACK="zig-out-$PLATFORM_NAME/repack"
            rm -rf "$REPACK"; mkdir -p "$REPACK/lookout" "$REPACK/tile57"
            (cd "$REPACK/lookout" && ar x ../../lib/liblookout_marine.a)
            (cd "$REPACK/tile57"  && ar x ../../lib/libtile57.a)
            chmod 644 "$REPACK"/lookout/*.o "$REPACK"/tile57/*.o
            xcrun -sdk "$PLATFORM_NAME" libtool -static \
              -o "zig-out-$PLATFORM_NAME/lib/liblookoutall.a" \
              "$REPACK"/lookout/*.o "$REPACK"/tile57/*.o 2>/dev/null
            echo "$CORE_HASH" > "$REPACK_STAMP"
          fi

          # Xcode doesn't track libraries fed in via OTHER_LDFLAGS -l flags, so
          # a rebuilt Zig core would never RELINK the app (stale core in the
          # bundle). Force the link when the core changed by removing the
          # previous executable (link-only cost). The stamp lives in
          # TARGET_BUILD_DIR: per configuration/platform, like the executable
          # it guards.
          LINK_STAMP="$TARGET_BUILD_DIR/.zigcore.stamp"
          if [ "$(cat "$LINK_STAMP" 2>/dev/null)" != "$CORE_HASH" ]; then
            mkdir -p "$TARGET_BUILD_DIR"
            echo "$CORE_HASH" > "$LINK_STAMP"
            rm -f "$TARGET_BUILD_DIR/$EXECUTABLE_PATH"
          fi
    postBuildScripts:
      # The same shipped set as the macOS target, into this bundle. The modules
      # are wasm, so one build serves every platform and this needs no -Dtarget
      # and no per-platform prefix.
      #
      # LookoutPlugins, NOT Plugins. An iOS app bundle is flat, so
      # $UNLOCALIZED_RESOURCES_FOLDER_PATH is the bundle root and "Plugins"
      # lands on the system's own PlugIns directory, which is for app
      # extensions. The installer takes that directory over, and the app came up
      # with no own ship, no AIS, no NMEA 0183, no Signal K and no laylines,
      # saying only "Resources/Plugins is absent" in a log nobody reads.
      # ChartController.bundledPluginCandidates checks both names.
      - name: Bundle the core plugins into LookoutPlugins
        basedOnDependencyAnalysis: false
        script: |
          set -e
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          cd "$SRCROOT/.."
          zig build plugins
          DEST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/LookoutPlugins"
          mkdir -p "$DEST"
          rsync -a --delete zig-out/plugins-bundled/ "$DEST/"
          echo "bundled plugins: $(ls "$DEST" | grep -c '\.wasm$') module(s) in $DEST"

  # ---- Unit tests ------------------------------------------------------------
  # One source directory, two targets. The two app targets both produce a module
  # named LookoutMarine, so `@testable import LookoutMarine` reaches the shell on
  # either platform and one test is written once. The host app links the Zig
  # core, so the test bundle reaches the C ABI without linking it again.
  LookoutMarineTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: LookoutMarine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.beetlebug.lookout-marine-tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        ARCHS: arm64
        CODE_SIGN_STYLE: Automatic
        # `@testable import LookoutMarine` re-imports the app module's bridging
        # header, so the test bundle has to be able to find lookout.h too.
        SWIFT_OBJC_BRIDGING_HEADER: LookoutMarine/Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/../zig-out/include"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/LookoutMarine.app/Contents/MacOS/LookoutMarine"
        BUNDLE_LOADER: "$(TEST_HOST)"

  LookoutMarine-iOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: LookoutMarine-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.beetlebug.lookout-marine-ios-tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        ARCHS: arm64
        CODE_SIGN_STYLE: Automatic
        # See the macOS test target.
        SWIFT_OBJC_BRIDGING_HEADER: LookoutMarine/Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/../zig-out-$(PLATFORM_NAME)/include"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/LookoutMarine.app/LookoutMarine"
        BUNDLE_LOADER: "$(TEST_HOST)"

  # Touch-delivery smoke test (XCUITest): pinch must move the zoom readout.
  # Run: xcodebuild test -scheme LookoutMarine-iOS -destination 'platform=iOS Simulator,...'
  LookoutMarine-iOS-UITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: LookoutMarine-iOS/UITests
    dependencies:
      - target: LookoutMarine-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.beetlebug.lookout-marine-ios-uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        TEST_TARGET_NAME: LookoutMarine-iOS

# Both schemes are declared here so they are SHARED. A scheme xcodebuild
# creates for itself is user data: it carries no test action, so `xcodebuild
# test` on a fresh checkout would find nothing to run.
schemes:
  LookoutMarine:
    build:
      targets:
        LookoutMarine: all
    test:
      # The tests are hosted by the app, and the app hands over to a copy
      # already running and exits. With one open, the test host exited 0 before
      # the runner could connect and the failure named neither cause.
      environmentVariables:
        LOOKOUT_MULTI: "1"
      targets:
        - LookoutMarineTests
  LookoutMarine-iOS:
    build:
      targets:
        LookoutMarine-iOS: all
    test:
      targets:
        - LookoutMarine-iOSTests
        - LookoutMarine-iOS-UITests
