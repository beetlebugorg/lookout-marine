name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: "0.16.0"

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      # vk is the Linux shell's backend. The default here would be sdl, and no
      # runner image package provides SDL3 for pkg-config.
      - run: zig build -Dbackend=vk

      # `zig build` does not rebuild the plugin wasm; `plugins` does.
      - run: zig build plugins

      - run: zig build test -Dbackend=vk

  linux:
    name: Linux app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libvulkan-dev libx11-dev \
                                  libwayland-dev meson ninja-build

      # The plugin host links the WAMR archive for this architecture. Without
      # it meson needs -Dplugins=false, and the app has no own ship, no traffic
      # and no instrument input.
      - name: Build WAMR
        run: scripts/build-wamr.sh linux-x64

      - name: Build
        working-directory: linux
        run: |
          meson setup build --prefix=/usr
          ninja -C build
          DESTDIR="$PWD/dist" meson install -C build

      - uses: actions/upload-artifact@v5
        with:
          name: lookout-marine-linux-x64
          path: linux/dist

  apple:
    name: macOS and iOS apps
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      # The target's script phases build WAMR and the Zig cores, so xcodebuild
      # is the whole build. There is no signing identity on a runner: ad-hoc
      # for the Mac app, none at all for a simulator build.
      - name: Build macOS
        run: |
          xcodebuild -project macos/LookoutMarine.xcodeproj -scheme LookoutMarine \
            -configuration Release -destination 'platform=macOS' \
            -derivedDataPath macos/build-mac \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= build

      - name: Build iOS
        run: |
          xcodebuild -project macos/LookoutMarine.xcodeproj -scheme LookoutMarine-iOS \
            -configuration Release -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath macos/build-mac \
            CODE_SIGNING_ALLOWED=NO build

      # Tar first: an artifact zip drops the executable bit, which leaves an
      # .app that will not launch.
      - name: Package
        run: |
          products=macos/build-mac/Build/Products
          tar -czf LookoutMarine-macos.tar.gz -C "$products/Release" LookoutMarine.app
          tar -czf LookoutMarine-iossimulator.tar.gz \
            -C "$products/Release-iphonesimulator" LookoutMarine.app

      - uses: actions/upload-artifact@v5
        with:
          name: lookout-marine-macos-arm64
          path: LookoutMarine-macos.tar.gz

      - uses: actions/upload-artifact@v5
        with:
          name: lookout-marine-ios-simulator-arm64
          path: LookoutMarine-iossimulator.tar.gz

  windows:
    name: Windows app
    # ARM64 with Visual Studio 2026, for the toolset the vcxproj names (v145)
    # and for the WAMR archive: the MSVC ABI is built by zig cc against the
    # installed MSVC headers and Windows SDK, so it needs a Windows host.
    runs-on: windows-11-vs2026-arm
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: microsoft/setup-msbuild@v2

      # Own ship, AIS, NMEA 0183, Signal K and laylines are wasm plugins, so a
      # core without this archive is a chart with no boat and no traffic.
      - name: Build WAMR
        shell: bash
        run: scripts/build-wamr.sh windows-arm64

      - name: Build core
        run: pwsh windows/build-core.ps1 -Platform ARM64

      - name: Build
        run: |
          msbuild windows/LookoutMarine.vcxproj -t:Restore /p:Configuration=Release /p:Platform=ARM64
          msbuild windows/LookoutMarine.vcxproj /p:Configuration=Release /p:Platform=ARM64

      - uses: actions/upload-artifact@v5
        with:
          name: lookout-marine-windows-arm64
          path: windows/ARM64/Release

  android:
    name: Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3

      # The versions android/app/build.gradle names. Gradle runs build-libs.sh
      # for the core before the CMake link.
      - name: Install NDK
        run: sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Build
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v5
        with:
          name: lookout-marine-android-arm64
          path: android/app/build/outputs/apk/debug/app-debug.apk
