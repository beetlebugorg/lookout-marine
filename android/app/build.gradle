plugins {
    id 'com.android.application'
}

android {
    namespace = "org.beetlebug.lookout"
    compileSdkVersion 35
    ndkVersion = "27.2.12479018"
    defaultConfig {
        applicationId = "org.beetlebug.lookout"
        // minSdk 24 matches the NDK API level the Zig core is built against
        // (see -Dandroid-api / the libc crt dir).
        minSdkVersion 24
        targetSdkVersion 35
        versionCode 1
        versionName "1.0"
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_PLATFORM=android-24", "-DANDROID_STL=c++_static"
                // arm64-v8a only: the Apple-silicon emulator image + the prebuilt
                // Zig core are AArch64. Add more once cross-built for them.
                abiFilters 'arm64-v8a'
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    applicationVariants.all { variant ->
        tasks["merge${variant.name.capitalize()}Assets"]
            .dependsOn("externalNativeBuild${variant.name.capitalize()}")
    }
    sourceSets.main {
        jniLibs.srcDir 'libs'
    }
    externalNativeBuild {
        cmake {
            path 'jni/CMakeLists.txt'
        }
    }
    lint {
        abortOnError = false
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}
