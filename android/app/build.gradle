plugins {
    id 'com.android.application'
}

android {
    namespace = "org.beetlebug.lookout"
    compileSdkVersion 35
    ndkVersion = "27.2.12479018"
    defaultConfig {
        applicationId = "org.beetlebug.lookout"
        // minSdk 24 matches the NDK API level the Zig core is built against
        // (see -Dandroid-api / the libc crt dir).
        minSdkVersion 24
        targetSdkVersion 35
        versionCode 1
        versionName "1.0"
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_PLATFORM=android-24", "-DANDROID_STL=c++_static"
                // arm64-v8a only: the Apple-silicon emulator image + the prebuilt
                // Zig core are AArch64. Add more once cross-built for them.
                abiFilters 'arm64-v8a'
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    applicationVariants.all { variant ->
        tasks["merge${variant.name.capitalize()}Assets"]
            .dependsOn("externalNativeBuild${variant.name.capitalize()}")
    }
    sourceSets.main {
        jniLibs.srcDir 'libs'
    }
    externalNativeBuild {
        cmake {
            path 'jni/CMakeLists.txt'
        }
    }
    lint {
        abortOnError = false
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}

// Cross-compile the Zig core (liblookout_marine.a + libtile57.a via build-libs.sh)
// before CMake links it, so a plain `./gradlew assembleDebug` rebuilds everything
// in one step. Runs with the exact NDK gradle uses (android.ndkDirectory) and the
// ABIs from abiFilters. externalNativeBuild* (the CMake link) depends on it.
def buildZigCore = tasks.register('buildZigCore', Exec) {
    workingDir = file("${projectDir}/..")            // the android/ dir
    commandLine './build-libs.sh'
    environment 'ANDROID_NDK', android.ndkDirectory
    def abis = android.defaultConfig.externalNativeBuild.cmake.abiFilters
    if (abis) environment 'ABIS', abis.join(' ')
    // Always run — `zig build` is incremental (fast on a warm cache), so this
    // avoids fragile up-to-date checks across the lookout + sibling tile57 trees.
}
// AGP names the native tasks buildCMake<Variant>[<abi>] / configureCMake… (older
// AGP used externalNativeBuild…) — cover both so the .a's exist before the link.
tasks.matching {
    it.name.contains('CMake') || it.name.startsWith('externalNativeBuild')
}.configureEach {
    dependsOn buildZigCore
}
