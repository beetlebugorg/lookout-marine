# XcodeGen spec for the lookout-marine macOS app.
#
# Why XcodeGen: it declares the whole target — build settings, the Zig run-script
# phase, header/library search paths, framework links, bridging header — in this
# reviewable file instead of a fragile hand-written .pbxproj. Generate the project
# with:
#
#     brew install xcodegen         # once
#     cd macos && xcodegen generate # writes LookoutMarine.xcodeproj
#     open LookoutMarine.xcodeproj
#
# Set TILE57_DIR (below, or in Xcode) to your tile57 checkout. The pre-build
# script runs `zig build` to produce liblookout_marine.a before compiling Swift.

name: LookoutMarine

options:
  bundleIdPrefix: org.beetlebug
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    # Point this at your tile57 checkout (contains include/ and zig-out/lib/).
    TILE57_DIR: "$(SRCROOT)/../../tile57"

targets:
  LookoutMarine:
    type: application
    platform: macOS
    sources:
      - path: LookoutMarine
    settings:
      base:
        PRODUCT_NAME: LookoutMarine
        PRODUCT_BUNDLE_IDENTIFIER: org.beetlebug.lookout-marine
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: LookoutMarine/Info.plist
        CODE_SIGN_ENTITLEMENTS: LookoutMarine/LookoutMarine.entitlements
        CODE_SIGN_STYLE: Automatic
        SWIFT_OBJC_BRIDGING_HEADER: LookoutMarine/Bridging-Header.h
        # Let the Zig build phase run without the user-script sandbox blocking it.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # lookout.h (repo include/) and tile57.h.
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/../include"
          - "$(TILE57_DIR)/include"
        LIBRARY_SEARCH_PATHS:
          - "$(SRCROOT)/../zig-out/lib"
          - "$(TILE57_DIR)/zig-out/lib"
        # Static Zig cores (rendering is direct Metal — the shim is inside
        # liblookout_marine.a).
        OTHER_LDFLAGS:
          - "-llookout_marine"
          - "-ltile57"
    dependencies:
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: CoreGraphics.framework
      - sdk: UniformTypeIdentifiers.framework
    preBuildScripts:
      - name: Build Zig cores (tile57 + liblookout_marine.a)
        basedOnDependencyAnalysis: false
        script: |
          set -e
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          # Build the tile57 ENGINE first so its libtile57.a exists before the
          # lookout core links it. Zig's cache makes this ~instant when tile57
          # is unchanged. (Previously a manual prerequisite.)
          ( cd "$TILE57_DIR" && zig build lib -Doptimize=ReleaseFast )
          cd "$SRCROOT/.."
          zig build -Dtile57="$TILE57_DIR" -Doptimize=ReleaseFast

  # ---- iOS -------------------------------------------------------------------
  # Same Swift sources; the chart renders via Metal into ChartUIView's own
  # CAMetalLayer (the plain-UIKit input window), with the SwiftUI chrome in a
  # PassThroughWindow above. Only dependency beyond this repo: tile57
  # cross-built per platform (the pre-build script expects
  # $TILE57_DIR/zig-out-$PLATFORM_NAME/lib/libtile57.a).
  LookoutMarine-iOS:
    type: application
    platform: iOS
    sources:
      - path: LookoutMarine
        excludes:
          - "Info.plist"
          - "LookoutMarine.entitlements"
    settings:
      base:
        PRODUCT_NAME: LookoutMarine
        PRODUCT_BUNDLE_IDENTIFIER: org.beetlebug.lookout-marine-ios
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: LookoutMarine-iOS/Info.plist
        CODE_SIGN_STYLE: Automatic
        SWIFT_OBJC_BRIDGING_HEADER: LookoutMarine/Bridging-Header.h
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # The Zig cores are built arm64-only (Apple Silicon simulators + all
        # supported devices) — don't ask ld for x86_64.
        ARCHS: arm64
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/../include"
          - "$(TILE57_DIR)/include"
        LIBRARY_SEARCH_PATHS:
          - "$(SRCROOT)/../zig-out-$(PLATFORM_NAME)/lib"
        # The merged, libtool-repacked Zig cores (see the pre-build script).
        OTHER_LDFLAGS:
          - "-llookoutall"
    dependencies:
      - sdk: UIKit.framework
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: CoreGraphics.framework
      - sdk: UniformTypeIdentifiers.framework
    preBuildScripts:
      - name: Build Zig cores for iOS (tile57 + liblookout_marine.a)
        basedOnDependencyAnalysis: false
        script: |
          set -e
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          case "$PLATFORM_NAME" in
            iphonesimulator) ZIG_TARGET=aarch64-ios-simulator ;;
            *)               ZIG_TARGET=aarch64-ios ;;
          esac
          # The iOS SDK sysroot. $SDKROOT is set by Xcode to the active SDK, so
          # this works in the Xcode build env even when the *shell's* xcrun/
          # xcode-select points at the Command Line Tools (which have no iOS SDK
          # -> an empty --sysroot). Fall back to xcrun for non-Xcode invocations.
          SYSROOT="${SDKROOT:-$(xcrun --sdk "$PLATFORM_NAME" --show-sdk-path)}"

          # 1) Cross-build the tile57 ENGINE for this platform, so its
          #    libtile57.a exists before the lookout core links it. Zig's cache
          #    makes this ~instant when tile57 is unchanged. (Previously a manual
          #    prerequisite; see macos/README.md "iOS".)
          ( cd "$TILE57_DIR" && zig build lib \
              -Dtarget="$ZIG_TARGET" -Doptimize=ReleaseFast \
              --sysroot "$SYSROOT" -p "zig-out-$PLATFORM_NAME" )

          # 2) Cross-build the lookout core against it.
          cd "$SRCROOT/.."
          zig build -Dtile57="$TILE57_DIR" -Doptimize=ReleaseFast \
            -Dtile57_lib="$TILE57_DIR/zig-out-$PLATFORM_NAME/lib/libtile57.a" \
            -Dtarget="$ZIG_TARGET" \
            --sysroot "$SYSROOT" \
            -p "zig-out-$PLATFORM_NAME"
          # ld64 AND libtool both drop zig-emitted archive members ("64-bit
          # mach-o not 8-byte aligned"), so feeding the archives to libtool
          # silently loses every symbol. Extract the members to loose object
          # files (which have no offset-alignment problem; zig also records
          # mode-0 permissions, hence the chmod) and repack from those.
          REPACK="zig-out-$PLATFORM_NAME/repack"
          rm -rf "$REPACK"; mkdir -p "$REPACK/lookout" "$REPACK/tile57"
          (cd "$REPACK/lookout" && ar x ../../lib/liblookout_marine.a)
          (cd "$REPACK/tile57"  && ar x "$TILE57_DIR/zig-out-$PLATFORM_NAME/lib/libtile57.a")
          chmod 644 "$REPACK"/lookout/*.o "$REPACK"/tile57/*.o
          xcrun -sdk "$PLATFORM_NAME" libtool -static \
            -o "zig-out-$PLATFORM_NAME/lib/liblookoutall.a" \
            "$REPACK"/lookout/*.o "$REPACK"/tile57/*.o 2>/dev/null

  # Touch-delivery smoke test (XCUITest): pinch must move the zoom readout.
  # Run: xcodebuild test -scheme LookoutMarine-iOS -destination 'platform=iOS Simulator,...'
  LookoutMarine-iOS-UITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: LookoutMarine-iOS/UITests
    dependencies:
      - target: LookoutMarine-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.beetlebug.lookout-marine-ios-uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        TEST_TARGET_NAME: LookoutMarine-iOS

schemes:
  LookoutMarine-iOS:
    build:
      targets:
        LookoutMarine-iOS: all
    test:
      targets:
        - LookoutMarine-iOS-UITests
