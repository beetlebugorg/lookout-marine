			shellScript = "set -e\nexport PATH=\"/opt/homebrew/bin:/usr/local/bin:$PATH\"\n# Provenance: the build log states exactly which sources these cores\n# came from — never infer it again. tile57 is a zig package\n# dependency: a sibling checkout when present, else the zon pin.\nT57=\"$SRCROOT/../../tile57\"\necho \"zig cores: lookout=$(git -C \"$SRCROOT/..\" rev-parse --short HEAD 2>/dev/null || echo '?') | tile57=$([ -f \"$T57/build.zig\" ] && git -C \"$T57\" rev-parse --short HEAD 2>/dev/null || echo 'fetched: build.zig.zon pin')\"\n# Versioned at the deployment minimum — see the macOS target's note.\nIOS_MIN=\"${IPHONEOS_DEPLOYMENT_TARGET:-26.0}\"\n# build.zig picks the WAMR dist directory from the zig target:\n# vendor/wamr-dist-iossim for the simulator, vendor/wamr-dist-ios for\n# a device. The two selections must agree.\ncase \"$PLATFORM_NAME\" in\n  iphonesimulator) ZIG_TARGET=\"aarch64-ios.${IOS_MIN}-simulator\"; WAMR_TARGET=iossim ;;\n  *)               ZIG_TARGET=\"aarch64-ios.${IOS_MIN}\";           WAMR_TARGET=ios ;;\nesac\n# The iOS SDK sysroot. $SDKROOT is set by Xcode to the active SDK, so\n# this works in the Xcode build env even when the *shell's* xcrun/\n# xcode-select points at the Command Line Tools (which have no iOS SDK\n# -> an empty --sysroot). Fall back to xcrun for non-Xcode invocations.\nSYSROOT=\"${SDKROOT:-$(xcrun --sdk \"$PLATFORM_NAME\" --show-sdk-path)}\"\n\n# One cross-build: the tile57 engine (zig package dependency) + the\n# lookout core, installing both archives + headers into\n# zig-out-$PLATFORM_NAME/ (device and simulator keep separate\n# prefixes). Zig's cache makes unchanged rebuilds ~instant.\ncd \"$SRCROOT/..\"\n# The wasm plugin host for this platform, before the core that embeds\n# it. See the macOS target for why -Dplugins is explicit.\nscripts/build-wamr.sh \"$WAMR_TARGET\"\nzig build -Doptimize=ReleaseFast \\\n  -Dplugins=true \\\n  -Dtarget=\"$ZIG_TARGET\" \\\n  --sysroot \"$SYSROOT\" \\\n  -p \"zig-out-$PLATFORM_NAME\"\n# Zig's outputs are deterministic, so an unchanged core hashes\n# identically — used twice below: to skip the repack, and to force\n# Xcode to relink when the core DID change.\nCORE_HASH=$(cat \"zig-out-$PLATFORM_NAME/lib/liblookout_marine.a\" \"zig-out-$PLATFORM_NAME/lib/libtile57.a\" | /usr/bin/shasum | cut -d' ' -f1)\n\n# ld64 AND libtool both drop zig-emitted archive members (\"64-bit\n# mach-o not 8-byte aligned\"), so feeding the archives to libtool\n# silently loses every symbol. Extract the members to loose object\n# files (which have no offset-alignment problem; zig also records\n# mode-0 permissions, hence the chmod) and repack from those.\n# Skipped when the archives are byte-identical to the last repack.\nREPACK_STAMP=\"zig-out-$PLATFORM_NAME/lib/.liblookoutall.stamp\"\nif [ \"$(cat \"$REPACK_STAMP\" 2>/dev/null)\" != \"$CORE_HASH\" ] \\\n   || [ ! -f \"zig-out-$PLATFORM_NAME/lib/liblookoutall.a\" ]; then\n  REPACK=\"zig-out-$PLATFORM_NAME/repack\"\n  rm -rf \"$REPACK\"; mkdir -p \"$REPACK/lookout\" \"$REPACK/tile57\"\n  (cd \"$REPACK/lookout\" && ar x ../../lib/liblookout_marine.a)\n  (cd \"$REPACK/tile57\"  && ar x ../../lib/libtile57.a)\n  chmod 644 \"$REPACK\"/lookout/*.o \"$REPACK\"/tile57/*.o\n  xcrun -sdk \"$PLATFORM_NAME\" libtool -static \\\n    -o \"zig-out-$PLATFORM_NAME/lib/liblookoutall.a\" \\\n    \"$REPACK\"/lookout/*.o \"$REPACK\"/tile57/*.o 2>/dev/null\n  echo \"$CORE_HASH\" > \"$REPACK_STAMP\"\nfi\n\n# Xcode doesn't track libraries fed in via OTHER_LDFLAGS -l flags, so\n# a rebuilt Zig core would never RELINK the app (stale core in the\n# bundle). Force the link when the core changed by removing the\n# previous executable (link-only cost). The stamp lives in\n# TARGET_BUILD_DIR: per configuration/platform, like the executable\n# it guards.\nLINK_STAMP=\"$TARGET_BUILD_DIR/.zigcore.stamp\"\nif [ \"$(cat \"$LINK_STAMP\" 2>/dev/null)\" != \"$CORE_HASH\" ]; then\n  mkdir -p \"$TARGET_BUILD_DIR\"\n  echo \"$CORE_HASH\" > \"$LINK_STAMP\"\n  rm -f \"$TARGET_BUILD_DIR/$EXECUTABLE_PATH\"\nfi\n";
		};
