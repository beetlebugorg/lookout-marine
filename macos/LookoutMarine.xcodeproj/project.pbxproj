			shellPath = /bin/sh;
			shellScript = "set -e\nexport PATH=\"/opt/homebrew/bin:/usr/local/bin:$PATH\"\n# Provenance: the build log states exactly which sources these cores\n# came from — never infer it again. tile57 is a zig package\n# dependency: a sibling checkout when present, else the zon pin.\nT57=\"$SRCROOT/../../tile57\"\necho \"zig cores: lookout=$(git -C \"$SRCROOT/..\" rev-parse --short HEAD 2>/dev/null || echo '?') | tile57=$([ -f \"$T57/build.zig\" ] && git -C \"$T57\" rev-parse --short HEAD 2>/dev/null || echo 'fetched: build.zig.zon pin')\"\n# Version the target at the DEPLOYMENT minimum: an unversioned native\n# build stamps objects with the build machine's OS and ld warns\n# \"built for newer macOS version than being linked\" on every object.\nZIG_MAC_TARGET=\"$(uname -m | sed s/arm64/aarch64/)-macos.${MACOSX_DEPLOYMENT_TARGET:-26.0}\"\n# An explicit -Dtarget makes zig a CROSS build: no automatic SDK\n# discovery, so hand it the sysroot like the iOS script does.\nMAC_SYSROOT=\"${SDKROOT:-$(xcrun --sdk macosx --show-sdk-path)}\"\ncd \"$SRCROOT/..\"\n# The wasm plugin host, before the core that embeds it. Own ship,\n# AIS, NMEA 0183, Signal K and laylines are all plugins, so a core\n# built without the host is a chartplotter with no own ship and no\n# traffic. build-wamr.sh is idempotent: it compares the WAMR_VERSION\n# stamp in the dist against the release, commit and feature set it\n# would build now, and returns in a fraction of a second once they\n# match. The first run clones and builds the pinned WAMR and takes a\n# few minutes. -Dplugins is passed explicitly below because its\n# default is off when the archive is absent, which builds a working\n# app with no plugin host inside it. Explicit turns that into a build\n# error naming this script.\nscripts/build-wamr.sh macos\n# One build: the tile57 engine (zig package dependency) + the lookout\n# core, installing liblookout_marine.a, libtile57.a, and both headers\n# into zig-out/. ReleaseFast is the build.zig default; explicit here\n# so the app build states its intent.\nzig build -Doptimize=ReleaseFast -Dplugins=true -Dtarget=\"$ZIG_MAC_TARGET\" --sysroot \"$MAC_SYSROOT\"\n# Zig's outputs are deterministic, so an unchanged core hashes\n# identically — used twice below: to skip the repack, and to force\n# Xcode to relink when the core DID change.\nCORE_HASH=$(cat \"zig-out/lib/liblookout_marine.a\" \"zig-out/lib/libtile57.a\" | /usr/bin/shasum | cut -d' ' -f1)\n\n# ld64 AND libtool both drop/reject zig-emitted archive members\n# (\"64-bit mach-o not 8-byte aligned\"), so the raw archives are never\n# linked directly: extract to loose objects (no offset-alignment\n# problem; zig also records mode-0 permissions, hence the chmod) and\n# repack, exactly like the iOS target. Skipped when unchanged.\nREPACK_STAMP=\"zig-out/lib/.liblookoutall.stamp\"\nif [ \"$(cat \"$REPACK_STAMP\" 2>/dev/null)\" != \"$CORE_HASH\" ] \\\n   || [ ! -f \"zig-out/lib/liblookoutall.a\" ]; then\n  REPACK=\"zig-out/repack\"\n  rm -rf \"$REPACK\"; mkdir -p \"$REPACK/lookout\" \"$REPACK/tile57\"\n  (cd \"$REPACK/lookout\" && ar x ../../lib/liblookout_marine.a)\n  (cd \"$REPACK/tile57\"  && ar x ../../lib/libtile57.a)\n  chmod 644 \"$REPACK\"/lookout/*.o \"$REPACK\"/tile57/*.o\n  xcrun -sdk macosx libtool -static \\\n    -o \"zig-out/lib/liblookoutall.a\" \\\n    \"$REPACK\"/lookout/*.o \"$REPACK\"/tile57/*.o 2>/dev/null\n  echo \"$CORE_HASH\" > \"$REPACK_STAMP\"\nfi\n\n# Xcode doesn't track libraries fed in via OTHER_LDFLAGS -l flags, so\n# a rebuilt Zig core would never RELINK the app (stale core in the\n# bundle). Force the link when the core changed by removing the\n# previous executable (link-only cost). The stamp lives in\n# TARGET_BUILD_DIR: per configuration, like the executable it guards.\nLINK_STAMP=\"$TARGET_BUILD_DIR/.zigcore.stamp\"\nif [ \"$(cat \"$LINK_STAMP\" 2>/dev/null)\" != \"$CORE_HASH\" ]; then\n  mkdir -p \"$TARGET_BUILD_DIR\"\n  echo \"$CORE_HASH\" > \"$LINK_STAMP\"\n  rm -f \"$TARGET_BUILD_DIR/$EXECUTABLE_PATH\"\nfi\n";
